name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/crestview-baptist-site-c141

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crestview-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/crestview-mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
